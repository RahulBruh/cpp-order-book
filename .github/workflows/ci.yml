name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        sanitize: [OFF, ON]
    name: ${{ matrix.compiler }} sanitize=${{ matrix.sanitize }}
    steps:
      - uses: actions/checkout@v4
      - name: Install GoogleTest
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.sanitize == 'ON' && 'RelWithDebInfo' || 'Release' }}
          -DLOB_SANITIZE=${{ matrix.sanitize }}
          -DLOB_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (smoke)
        if: matrix.sanitize == 'OFF'
        run: ./build/lob_bench --messages 1000000 --reps 3

  wasm:
    runs-on: ubuntu-24.04
    name: WebAssembly demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install toolchains
        run: >
          sudo apt-get update && sudo apt-get install -y clang lld wasi-libc
          libc++-18-dev-wasm32 libclang-rt-18-dev-wasm32 libc++-18-dev libc++abi-18-dev
      - name: Build orderbook.wasm
        run: ./web/build.sh
      - name: Native libc++ benchmark (reference for the wasm build)
        run: |
          clang++ -std=c++20 -O2 -stdlib=libc++ -I include bench/bench.cpp -o bench_libcxx
          ./bench_libcxx --messages 1000000 --seed 42 --reps 1 | tee bench.txt
      - name: Test the wasm build against the native one
        run: |
          read trades shares < <(sed -nE 's/^Trades: ([0-9]+) \(([0-9]+) shares\).*/\1 \2/p' bench.txt)
          node web/test_wasm.mjs "$trades" "$shares"
      - uses: actions/upload-artifact@v4
        with:
          name: orderbook-web
          path: |
            web/*.html
            web/*.css
            web/*.js
            web/orderbook.wasm
